plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '1.10.2'
// Optional exact-pack client profile; default builds retain the older supported API.
def neoOtherworldDirectory = providers.gradleProperty('neoOtherworldDirectory').orNull
def tensuraFileId = neoOtherworldDirectory ? '9289888' : '8793360'
group = 'dev.heavenlyrestriction'
base { archivesName = 'TensuraAdditionalAdditions' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    mavenCentral()
    maven { url = 'https://www.cursemaven.com'; content { includeGroup 'curse.maven' } }
    maven { url = 'https://maven.architectury.dev' }
}
neoForge {
    version = neoOtherworldDirectory ? '21.1.248' : '21.1.209'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'heavenlyrestriction'
        }
    }
    mods { heavenlyrestriction { sourceSet sourceSets.main } }
}
configurations { manasModules { transitive = false } }
def extractManasApi = tasks.register('extractManasApi', Copy) {
    from({ zipTree(configurations.manasModules.singleFile) }) {
        include 'META-INF/jars/*.jar'
        eachFile { path = name }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('manascore-api')
}
dependencies {
    implementation "curse.maven:tensura-reincarnated-643695:${tensuraFileId}"
    implementation 'curse.maven:manascore-619025:8022425'
    // ManasCore's public APIs are in its nested module jars.
    manasModules 'curse.maven:manascore-619025:8022425'
    compileOnly files(fileTree(dir: layout.buildDirectory.dir('manascore-api'), include: '*.jar')).builtBy(extractManasApi)
    implementation 'dev.architectury:architectury-neoforge:13.0.8'
    if (!neoOtherworldDirectory) runtimeOnly fileTree(dir: 'libs/runtime', include: '*.jar')
    // Authored bosses/effects and native circles use GeckoLib's public API.
    if (neoOtherworldDirectory) compileOnly fileTree(dir: "${neoOtherworldDirectory}/client/mods", include: ['geckolib-*.jar', 'smartbrainlib-*.jar'])
    else compileOnly fileTree(dir: 'libs/runtime', include: ['geckolib-*.jar', 'SmartBrainLib-*.jar'])
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

if (neoOtherworldDirectory) {
    neoForge.runs.client.gameDirectory = file("${neoOtherworldDirectory}/client")
    def cleanMinecraft = providers.gradleProperty('connectorCleanPath').orNull
    if (cleanMinecraft) {
        neoForge.runs.client.systemProperty('connector.clean.path', cleanMinecraft)
        neoForge.runs.gameTestServer.systemProperty('connector.clean.path', cleanMinecraft)
    }
}
